# The toolchain alpha is built and tested with. tools/fetch-toolchain stages
# it into .wolf-bin/ and refuses any archive whose sha256 differs from the
# digests below; tools/lib-toolchain.sh refuses a staged wolf or lupin whose
# `--version` first line differs from `version_line`.
#
# wolf v0.2.41 (release 458496472, tag v0.2.41 -> 02615972) and lupin v0.1.63
# (release 456389804, tag v0.1.63 -> 2becebc4): the whole published release
# archives, their asset digests read twice from the release API on 2026-11-26,
# the two reads identical.
#
# The std pin is wolf-std c339a471 (tree f617e5aa). The wolf 0.2.41 archive
# bundles 32a1cd06, two commits later, whose std/ tree is the same (both
# ea054bf1); the pin carries std.poll's one wait over files, sockets and
# signals, which the manager's event loop is built on. tools/fetch-toolchain
# stages the std at this pin in place of the bundled tree, never over it.

[wolf]
version = "0.2.41"
repo = "wolffe-lang/wolf-lang"
rev = "0261597230b46f17f7a894c5558452c19fa31b96"
version_line = "wolf 0.2.41 (wolfgang, pin 0261597)"
aarch64-apple-darwin = "979dbb22b59268fb552081cfc5666da1f8e4adea831a286b396f78161cb893d5"
x86_64-unknown-linux-gnu = "e7ec4cde06db2f2235ae82e3dff1db06f6b8e37249c883a3a35bdee8c86b8c34"
aarch64-unknown-linux-gnu = "a4319aab6203928960c632b37a95e58765bd51d343d7b376af49a3ac878b1fd3"

[lupin]
