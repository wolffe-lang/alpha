# The toolchain alpha is built and tested with. tools/fetch-toolchain stages
# it into .wolf-bin/ and refuses any archive whose sha256 differs from the
# digests below; tools/lib-toolchain.sh refuses a staged wolf or lupin whose
# `--version` first line differs from `version_line`.
#
# wolf v0.2.40 (release 443798290, tag v0.2.40 -> b333b9da) and lupin v0.1.62
# (release 443651522, tag v0.1.62 -> 72eff3c9): the whole published release
# archives, their asset digests read twice from the release API on 2026-11-21,
# the two reads identical.
#
# The std pin is wolf-std c339a471 (tree f617e5aa), newer than the be1d10fa
# the wolf 0.2.40 archive bundles: it carries std.poll's one wait over files,
# sockets and signals, which the manager's event loop is built on.
# tools/fetch-toolchain stages the std at this pin in place of the bundled
# tree, never over it.

[wolf]
version = "0.2.40"
repo = "wolffe-lang/wolf-lang"
rev = "b333b9da8560e4e1dfd6e30099d14d98e752f9e1"
version_line = "wolf 0.2.40 (wolfgang, pin b333b9d)"
aarch64-apple-darwin = "3f18a56562fb089da05a50a612e031cd297f20a617b9e6e7ada768fbeb69e72b"
x86_64-unknown-linux-gnu = "bc2020e0b7400c18162a6072c299c65c0582ea74a0eba22aaa57ca04ae13e7e1"
aarch64-unknown-linux-gnu = "cea26eea215e7cdba60db2870c0eb4d2c5738065046ec5fe6e0eec7da55e48cd"

[lupin]
version = "0.1.62"
repo = "wolffe-lang/wolf-interp"
rev = "72eff3c99b3a9e434b059f5dd3e4b1d29c862ddc"
version_line = "lupin 0.1.62 (wolf-interp, reference interpreter at pin 5f1f1c9)"
aarch64-apple-darwin = "228790ef3aef7605a2f9524abdcb6de5c8a5fa179437d82f3d3af262495a4e7f"
x86_64-unknown-linux-gnu = "3b3bf9c23a9e545a4a99e65a5183d0c5e71e91d6bfb8a189147e2701c03e177f"
aarch64-unknown-linux-gnu = "f5391308ad9cd8ae1e31a42e7a17c1453679e2a0ac03f83783c4ac52e650ef2e"

